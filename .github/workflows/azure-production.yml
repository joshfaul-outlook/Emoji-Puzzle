name: Deploy Azure production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: azure-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      PRODUCTION_HOSTNAME: emojizzle.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix api
      - run: npm run lint
      - run: npm test
      - run: npm run api:test
      - run: npm run api:build

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Provision production
        id: infra
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          az deployment group create --name emoji-daily-production --resource-group emoji-daily-prod-rg --template-file infra/resources.bicep --parameters location=eastus2 appName=emoji-daily-prod adminPassword="$ADMIN_PASSWORD" adminSessionSecret="$ADMIN_SESSION_SECRET" openAiApiKey="$OPENAI_API_KEY" customDomain="$PRODUCTION_HOSTNAME" --output none
          site_name=$(az deployment group show --name emoji-daily-production --resource-group emoji-daily-prod-rg --query properties.outputs.staticWebAppName.value --output tsv)
          storage_name=$(az deployment group show --name emoji-daily-production --resource-group emoji-daily-prod-rg --query properties.outputs.storageAccountName.value --output tsv)
          deploy_token=$(az staticwebapp secrets list --name "$site_name" --resource-group emoji-daily-prod-rg --query properties.apiKey --output tsv)
          connection=$(az storage account show-connection-string --name "$storage_name" --resource-group emoji-daily-prod-rg --query connectionString --output tsv)
          hostname=$(az deployment group show --name emoji-daily-production --resource-group emoji-daily-prod-rg --query properties.outputs.defaultHostname.value --output tsv)
          echo "::add-mask::$deploy_token"
          echo "::add-mask::$connection"
          echo "deploy_token=$deploy_token" >> "$GITHUB_OUTPUT"
          echo "connection=$connection" >> "$GITHUB_OUTPUT"
          echo "site_name=$site_name" >> "$GITHUB_OUTPUT"
          echo "hostname=$hostname" >> "$GITHUB_OUTPUT"

      - name: Build static frontend
        env:
          NEXT_PUBLIC_SITE_URL: https://${{ env.PRODUCTION_HOSTNAME }}
        run: |
          npm run build
          cp staticwebapp.config.json out/staticwebapp.config.json

      - name: Seed puzzle catalog
        env:
          TABLE_STORAGE_CONNECTION_STRING: ${{ steps.infra.outputs.connection }}
        run: npm run seed

      - name: Deploy frontend and managed API
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.infra.outputs.deploy_token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: out
          api_location: api
          output_location: ""
          skip_app_build: true

      - name: Smoke test production
        run: |
          site_url="https://$PRODUCTION_HOSTNAME"
          curl --fail --retry 5 --retry-delay 5 "$site_url/"
          puzzle=$(curl --fail --retry 5 --retry-delay 5 "$site_url/api/puzzles/current?mode=daily")
          puzzle_id=$(jq -r '.puzzle.id' <<< "$puzzle")
          puzzle_pool=$(jq -r '.puzzle.pool' <<< "$puzzle")
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' --retry 5 --retry-delay 5 \
            -H "Origin: $site_url" -H 'Content-Type: application/json' \
            --data "{\"puzzleId\":\"$puzzle_id\",\"pool\":\"$puzzle_pool\",\"guess\":\"__production_smoke_test__\"}" \
            "$site_url/api/guess")
          test "$status" = "401"
